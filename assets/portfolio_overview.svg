    <text x="20" y="52" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700">Edge Computer Vision &amp; Model Compression</text>

    <text x="20" y="76" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Industrial Edge Defect AOI:</tspan> 2D FFT High-Pass Filtering, SSIM &amp; Western Electric SPC</text>
    <text x="20" y="96" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Conveyor Packaging Inspection:</tspan> Connected-Component Geometry &amp; Pneumatic Ejector</text>
    <text x="20" y="116" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Edge Quantization Benchmark:</tspan> Symmetric INT8 PTQ &amp; Structured Channel Pruning</text>

    <rect x="20" y="132" width="148" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="94" y="150" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">AOI F1: 99.25%</text>

    <rect x="178" y="132" width="156" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="256" y="150" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">Eject Acc: 100.0%</text>

    <rect x="344" y="132" width="150" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="419" y="150" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">PTQ: 3.9x–6.45x</text>
  </g>

