  <g transform="translate(574, 338)">
    <rect width="514" height="176" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="514" height="4" rx="2" fill="url(#amberAccent)"/>

    <text x="20" y="30" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">PILLAR IV · STOCHASTIC OPTIMIZATION &amp; CLINICAL AI</text>
    <text x="20" y="52" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700">Probabilistic Forecasting &amp; Decision Engines</text>

    <text x="20" y="76" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Smart Grid Energy Forecaster:</tspan> Pinball Multi-Quantile (P10/P50/P90) &amp; HiGHS LP Dispatch</text>
    <text x="20" y="96" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Clinical Biomarker Risk Engine:</tspan> Isotonic Calibration, Brier Score &amp; Decision Curve (DCA)</text>
    <text x="20" y="116" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Dynamic Inventory RL Optimizer:</tspan> Bellman MDP &amp; Tabular Q-Learning Under Lead-Time Risk</text>

    <rect x="20" y="132" width="148" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="94" y="150" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">Grid Cost: -83.5%</text>

    <rect x="178" y="132" width="156" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="256" y="150" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">ECE: 0.0205 (-92.5%)</text>

    <rect x="344" y="132" width="150" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="419" y="150" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">Fill Rate: 98.29%</text>
