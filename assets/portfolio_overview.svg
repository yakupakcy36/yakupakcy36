    <text x="20" y="30" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">PILLAR I · OT / ICS &amp; CONDITION MONITORING</text>
    <text x="20" y="52" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700">Cyber-Physical &amp; Industrial AI Systems</text>

    <text x="20" y="76" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Industrial Predictive Maintenance:</tspan> Weibull RUL, XAI &amp; Asymmetric Cost Matrix</text>
    <text x="20" y="96" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">SCADA Cyber-Physical Intrusion:</tspan> Mass/Hydrostatic Invariants + IForest (MITRE ICS)</text>
    <text x="20" y="116" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Acoustic Machine Anomaly:</tspan> STFT Log-Mel Filterbank &amp; Bottleneck PCA Autoencoder</text>

    <rect x="20" y="132" width="148" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="94" y="150" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">PdM AUC: 0.9777</text>

    <rect x="178" y="132" width="156" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="256" y="150" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">SCADA FDI: 99.2% Rec</text>

    <rect x="344" y="132" width="150" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="419" y="150" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">Audio F1: 0.9972</text>
