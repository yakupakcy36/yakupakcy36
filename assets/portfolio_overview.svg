  <text x="32" y="82" fill="#f8fafc" font-family="Segoe UI, Inter, -apple-system, sans-serif" font-size="28" font-weight="800">Yakup Akçay — Applied AI &amp; Machine Learning Engineering</text>
  <text x="32" y="108" fill="#94a3b8" font-family="Segoe UI, Inter, -apple-system, sans-serif" font-size="14" font-weight="500">End-to-End Cyber-Physical Telemetry, Deterministic Guardrailed RAG, Edge Vision AOI &amp; Calibrated Decision Optimization</text>

