  <text x="46" y="40" fill="#38bdf8" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.2">PRODUCTION ML &amp; AI SYSTEMS ARCHITECTURE</text>

  <!-- KPI Badges Top Right -->
  <rect x="610" y="24" width="158" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="689" y="40" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">12 Flagship Systems</text>

  <rect x="778" y="24" width="152" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="854" y="40" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">13 ML/DL Foundations</text>

  <rect x="940" y="24" width="148" height="24" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
  <text x="1014" y="40" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">FastAPI · Docker · CI</text>

