    <text x="20" y="96" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Autonomous Data Analyst Agent:</tspan> Cyclic FSM, AST Audit, EXPLAIN Plan &amp; Self-Healing SQL</text>
    <text x="20" y="116" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• <tspan fill="#f1f5f9" font-weight="600">Multimodal Document Intelligence:</tspan> 2D Spatial Clustering &amp; Checksum Reconciliation</text>

    <rect x="20" y="132" width="148" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="94" y="150" fill="#c084fc" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">NDCG@5: 0.9539</text>

    <rect x="178" y="132" width="156" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="256" y="150" fill="#c084fc" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">SQL Heal: 100% Pass</text>

    <rect x="344" y="132" width="150" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="419" y="150" fill="#c084fc" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">Doc F1: 100% (3.9ms)</text>
  </g>

